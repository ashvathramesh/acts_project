        <div class="body">
            <div class="tongues_of_fire">
                <form>
                    <img src="{% static 'fire_tongue.jpeg' %}" class="img" alt="Tongues of Fire Image">
                    <label class="label">
                        <b>Tongues of Fire</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 2:1-4- "When the day of Pentecost came, they were all together in one place. Suddenly a sound like the blowing of a violent wind came from heaven and filled the whole house where they were sitting. They saw what seemed to be tongues of fire that separated and came to rest on each of them. All of them were filled with the Holy Spirit and began to speak in other tongues as the Spirit enabled them." 
                        <br><br>
                        <b>Facts:</b> The tongues of fire were used by Luke as a description of the holy spirit. These "tongues" appeared during the Pentecost and settled over the disciple's heads. They enabled them to speak in other languages. This is what Jesus meant by being baptized in the Holy Spirit. Since the fire that came over, their heads were a gift from God. (See ascension section).
                    </label>
                </form>
            </div>
            
            <div class="cloaks">
                <form>
                    <img src="{% static 'cloak.jpeg' %}" class="img" alt="Cloaks Image">
                    <label class="label">
                        <b>Cloaks</b>
                        <br><br>
                        <b>Facts:</b> Cloaks in Jesus's time were outer garments often worn for warmth. They were very common among the people of Israel, especially those who could afford little belongings. Most of the apostles wore them and people who were crippled or sick would also probably have a cloak on while on the street.
                        <br><br>
                        <b>Works Cited:</b> https://biblehub.com/topical/t/the_cloaks.htm
                    </label>
                </form>
            </div>
            
            <div class="prison_doors">
                <form>
                    <img src="{% static 'prison_door.jpeg' %}" class="img" alt="Prison Doors Image">
                    <label class="label">
                        <b>Prison Doors</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 5:17-19- "Then the high priest and all his associates, who were members of the party of the Sadducees, were filled with jealousy. They arrested the apostles and put them in the public jail. But during the night an angel of the Lord opened the doors of the jail and brought them out." Acts 16:25-26- "About midnight Paul and Silas were praying and singing hymns to God, and the other prisoners were listening to them. Suddenly there was such a violent earthquake that the foundations of the prison were shaken. At once all the prison doors flew open, and everyone's chains came loose."
                        <br><br>
                        <b>Facts:</b> Many of the apostles who preached the gospel were arrested and thrown in jail by the teachers of the law who wanted to stop Christianity. But God rescued them several times, by opening the prison doors in many ways. This symbolizes how God always makes a way for his followers.
                    </label>
                </form>
            </div>
            
            <div class="stones">
                <form>
                    <img src="{% static 'stones.jpeg' %}" class="img" alt="Stones Image">
                    <label class="label">
                        <b>Stones</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 7:57-58- "At this they covered their ears and, yelling at the top of their voices, they all rushed at him, dragged him out of the city and began to stone him."
                        <br><br>
                        <b>Facts:</b> Stones are mentioned several times in the bible, mostly because of stoning. Stoning was basically death by stones and was used on many Christians during the persecution. It was actually pretty brutal so I won't go into detail. (Noah: Basically you could die due to physical trauma, bleeding to death, breaking of the neck, or hemorrhaging) (Jared: We are not putting that in the project!) (Ashvath: Too late guys.) But one thing you should know is that Stephen, a holy and righteous man, was stoned to death after some Christian haters got him in trouble with the religious leaders. Before he died, Stephen was heard asking God to forgive his enemies.
                    </label>
                </form>
            </div>
            
            <div class="sandals">
                <form>
                    <img src="{% static 'sandals.jpg' %}" class="img" alt="Sandals Image">
                    <label class="label">
                        <b>Sandals</b>
                        <br><br>
                        <b>Facts:</b> Most sandals in the bible times were made of leather and dry grass. They provided protection from the ground, but not from the icky stuff on it. That's usually why in Bible times, most people had dirty feet. No offense to the apostles or Jesus. But sandals carried a historical significance mostly because even Jesus wore them. It symbolizes how he was willing to step into human shoes in order to save us (both literally and metaphorically)
                        <br><br>
                        <b>Works Cited:</b> https://holylandmarket.com/blogs/news/the-importance-of-sandals-during-biblical-times?srsltid=AfmBOootJKyV8n2vr85pqwGsumV3FfIyE0JzaeK8oWLaWJtybFY45vRq
                    </label>
                </form>
            </div>
            
            <div class="bread">
                <form>
                    <img src="{% static 'bread.jpeg' %}" class="img" alt="Bread Image">
                    <label class="label">
                        <b>Bread</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 2:46- "Every day they continued to meet together in the temple courts. They broke bread in their homes and ate together with glad and sincere hearts"
                        <br><br>
                        <b>Facts:</b> Bread back in the New Testament was either made of barley or wheat, based on what you could afford. The reason churches started having a tradition of breaking bread connects to when Jesus did it in the last supper. He broke the bread, saying that it was his body, and the disciples could do it in remembrance of him. This is something that churches still do today in communion.
                        <br><br>
                        <b>Works Cited:</b> https://hcscchurch.org/wp-content/uploads/2014/08/food.pdf https://www.gotquestions.org/breaking-of-bread.html
                    </label>
                </form>
            </div>
            
            <div class="nets">
                <form>
                    <img src="{% static 'nets.jpeg' %}" class="img" alt="Nets Image">
                    <label class="label">
                        <b>Nets</b>
                        <br><br>
                        <b>Facts:</b> In Jerusalem around the time of acts, fishing nets were used by fishermen as a way to catch fish from the water. They would let their nets down from a boat in order to catch fish. The fishing was done at night while the nets would be cleaned during the day. Many of the disciples were fishermen before choosing to follow Jesus. He told them they would become fishers of men and in the book of acts, that's just what they were doing. They preached the gospel and brought people to Christ.
                    </label>
                </form>
            </div>
            
            <div class="anchor">
                <form>
                    <img src="{% static 'anchor.webp' %}" class="img" alt="Anchor Image">
                    <label class="label">
                        <b>Anchor</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 27:29- "Fearing that we would be dashed against the rocks, they dropped four anchors from the stern and prayed for daylight."
                        <br><br>
                        <b>Facts:</b> Anchors were used by ships to hold them in place and resist the current. In Acts 27, the sailors on Paul's ship dropped all their anchors in an attempt to avoid being smashed on the rocks. God has also been described as an anchor, he keeps us safe in the raging storm.
                    </label>
                </form>
            </div>
            
            <div class="snake_on_malta">
                <form>
                    <img src="{% static 'snake.jpg' %}" class="img" alt="The Snake on Malta Image">
                    <label class="label">
                        <b>The Snake on Malta</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 28:1-6- "Once safely on shore, we found out that the island was called Malta. The islanders showed us unusual kindness. They built a fire and welcomed us all because it was raining and cold. Paul gathered a pile of brushwood and, as he put it on the fire, a viper, driven out by the heat, fastened itself on his hand. When the islanders saw the snake hanging from his hand, they said to each other, "This man must be a murderer; for though he escaped from the sea, the goddess Justice has not allowed him to live." But Paul shook the snake off into the fire and suffered no ill effects. The people expected him to swell up or suddenly fall dead; but after waiting a long time and seeing nothing unusual happen to him, they changed their minds and said he was a god."
                        <br><br>
                        <b>Facts:</b> The island of Malta was where Paul was shipwrecked for a while. During his stay with the locals, he was bit by a snake after it was driven out by the flames of the campfire. But Paul didn't become sick and instead just shook the snake off like it was nothing. The locals are amazed and theorized he must be a god. Interestingly, present day Malta has no venomous snakes. So it's possible that the snake that bit Paul wasn't venomous after all. Although according to Acts 28, the locals were amazed the bite didn't harm Paul, so that supports the idea of the snake being venomous. There is one snake on Malta called the cat snake which is mildly venomous, but not that dangerous. It's also a possibility that Paul was bitten by a snake that would later become extinct or rare, given that Malta is a densely populated island.
                        <br><br>
                        <b>Works Cited:</b> https://www.franklinunitedchurch.com/2009/11/01/the-maltese-viper-acts-281-10/ https://www.heavenonwheels.org/p/a-study-of-acts-kind-natives-of-malta
                    </label>
                </form>
            </div>
            
            <div class="belts">
                <form>
                    <img src="{% static 'belts.jpg' %}" class="img" alt="Belts Image">
                    <label class="label">
                        <b>Belts</b>
                        <br><br>
                        <b>Facts:</b> Many different types of belts were used by many different people in the New Testament. Leather belts were very common attire and some apostles almost certainly wore them. Metal belts were used by Roman soldiers as a part of their armor. But God's word also suggests using a different belt, the belt of truth, which is part of the armor of God. It symbolizes the truth of God's word and how we use it in our life.
                        <br><br>
                        <b>Works Cited:</b> https://biblehub.com/topical/t/the_belts.htm
                    </label>
                </form>
            </div>
            
            <div class="altars">
                <form>
                    <img src="{% static 'altar.jpg' %}" class="img" alt="Altars Image">
                    <label class="label">
                        <b>Altars</b>
                        <br><br>
                        <b>Facts:</b> The temple used altars for offerings made by people. The practice of using altars was done since Moses's time. People would offer an animal to kill as a symbolic sacrifice. Though now that Jesus had already come to the world, you didn't necessarily need to do this anymore, but it was still tradition. Altars were normally made of stone but sometimes had metal plating.
                    </label>
                </form>
            </div>
            
            <div class="four_footed_animals">
                <form>
                    <img src="{% static 'peter_animal.jpeg' %}" class="img" alt="Four-footed Animals Image">
                    <label class="label">
                        <b>Four-footed Animals</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 10:9-15- "About noon the following day as they were on their journey and approaching the city, Peter went up on the roof to pray. He became hungry and wanted something to eat, and while the meal was being prepared, he fell into a trance. He saw heaven opened and something like a large sheet being let down to earth by its four corners.  It contained all kinds of four-footed animals, as well as reptiles and birds.Then a voice told him, "Get up, Peter. Kill and eat.". "Surely not, Lord!" Peter replied. "I have never eaten anything impure or unclean.". The voice spoke to him a second time, "Do not call anything impure that God has made clean."
                        <br><br>
                        <b>Facts:</b> Many four footed animals were considered unclean by the law Moses. This was because, back in Leviticus, God gave the Israelites a specific list on what animals were clean and unclean. But in Acts 10, Peter sees a vision of four footed animals (that were classified as unclean), and was asked by an angel to eat some. The angel told Peter to not call anything impure that God has made clean. The four footed animals Peter saw were most likely creatures from the lands in or around Jerusalem. The red fox, golden jackal, Egyptian mongoose, Palestinian mountain gazelle, addax, and the rock hyrax are all possible examples.  (For more info on Peter's vision, see the section on Peter's vision of animals)
                    </label>
                </form>
            </div>
            
            <div class="lamps">
                <form>
                    <img src="{% static 'lamp.jpg' %}" class="img" alt="Lamps Image">
                    <label class="label">
                        <b>Lamps</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 20:8- "There were many lamps in the upper room where they were gathered together."
                        <br><br>
                        <b>Facts:</b> Lamps were made from either clay or metal. They were the main source of light in the houses, streets, and sacred spaces. The light was made using oil, commonly olive oil. Their design featured handles to enable portability.
                        <br><br>
                        <b>Works Cited:</b> https://biblehub.com/topical/t/the_lamps.htm
                    </label>
                </form>
            </div>
            
            <div class="whips">
                <form>
                    <img src="{% static 'whip.jpg' %}" class="img" alt="Whips Image">
                    <label class="label">
                        <b>Whips</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 5:40- "His speech persuaded them. They called the apostles in and had them flogged. Then they ordered them not to speak in the name of Jesus, and let them go." Acts 22:24- "The commander ordered that Paul be taken into the barracks. He directed that he be flogged and interrogated in order to find out why the people were shouting at him like this."
                        <br><br>
                        <b>Facts:</b> The term flogging basically means whipping. This happened a lot to Jesus's disciples and to Paul. A whip in the Bible times consisted of a handle and a flexible lash. It was used for punishing criminals and sometimes animals (Animal cruelty 😢).
                    </label>
                </form>
            </div>
            
            <div class="crowns">
                <form>
                    <img src="{% static 'crown.jpeg' %}" class="img" alt="Crowns Image">
                    <label class="label">
                        <b>Crowns</b>
                        <br><br>
                        <b>Facts:</b> Crowns were a symbol of royalty, authority, and prosperity. They were worn by the kings, queens, and emperors at the time of the New Testament. Jesus, being the king of kings, was expected to have one by the people. But he came as a humble child with no royal parents. In the book of acts, his disciples were continuing his ministry and humility and kindness.
                    </label>
                </form>
            </div>
            
            <div class="upper_room">
                <form>
                    <img src="{% static 'upper_room.jpeg' %}" class="img" alt="Upper Room Image">
                    <label class="label">
                        <b>Upper Room</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 1:12-14- "Then they returned to Jerusalem from the mount called Olivet, which is near Jerusalem, a Sabbath day's journey. And when they had entered, they went up into the upper room where they were staying: Peter, James, John, and Andrew; Philip and Thomas; Bartholomew and Matthew; James the son of Alphaeus and Simon the Zealot; and Judas the son of James. These all continued with one accord in prayer and supplication, with the women and Mary the mother of Jesus, and with His brothers."
                        <br><br>
                        <b>Facts:</b> The upper room was often where the followers of Jesus would meet to pray and spend time together. During Acts chapter one, the disciples gathered there along with Mary, Jesus's brothers, and several other people. It was right after the accession of Jesus, so they all gathered together.
                    </label>
                </form>
            </div>
            
            <div class="offering">
                <form>
                    <img src="{% static 'money.jpg' %}" class="img" alt="Offering Image">
                    <label class="label">
                        <b>Offering</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 10:4- "The angel answered, "Your prayers and gifts to the poor have come up as a memorial offering before God.". Acts 20:35- "It is more blessed to give than to receive."
                        <br><br>
                        <b>Facts:</b> Offerings were made at the temple to donate money for the church. Both the poor and the rich could do so with whatever money they had.
                    </label>
                </form>
            </div>
            
            <div class="chains">
                <form>
                    <img src="{% static 'chains.jpeg' %}" class="img" alt="Chains Image">
                    <label class="label">
                        <b>Chains</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 12:7- "Suddenly an angel of the Lord appeared and a light shone in the cell. He struck Peter on the side and woke him up. "Quick, get up!" he said, and the chains fell off Peter's wrists." Acts 28:20- "For this reason, therefore, I requested to see you and to speak with you, for I am wearing this chain for the sake of the hope of Israel"
                        <br><br>
                        <b>Facts:</b> Chains were used in prisons to restrain inmates much like how handcuffs are today. Only back then, chains were very heavy and dense, not much like how handcuffs are today. Many apostles were imprisoned and had their arms or feet (or sometimes both, it wasn't uncommon back then), chained to the wall and floor of the prison. However, more than once, God helped them escape and unlocked their chains. Chains also have a more spiritual meaning. They represent the sin in us that Christ came to free us from.
                        <br><br>
                        <b>Works Cited:</b> https://christiananswers.net/dictionary/chain.html
                    </label>
                </form>
            </div>
            
            <div class="scripture_scrolls">
                <form>
                    <img src="{% static 'scrolls.jpeg' %}" class="img" alt="Scripture Scrolls Image">
                    <label class="label">
                        <b>Scripture Scrolls</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 8:28- "And on his way home was sitting in his chariot reading the Book of Isaiah the prophet."
                        <br><br>
                        <b>Facts:</b> The entire law of Moses and the Old Testament was memorized by the teachers of the law. They kept careful accounts of everything that happened in the first half of the Bible (The New Testament wasn't added yet). The book of acts itself was written by Luke, most likely in Rome.
                    </label>
                </form>
            </div>
            
            <div class="staffs">
                <form>
                    <img src="{% static 'staff.jpeg' %}" class="img" alt="Staffs Image">
                    <label class="label">
                        <b>Staffs</b>
                        <br><br>
                        <b>Facts:</b> A staff was often similar to a rod, only with one end being crooked, forked, or knobbed. While many people in Jesus's time carried a staff while traveling, the most common people to use them were shepherds. Shepherds used wooden staffs to protect or guide their flock. The crooked end of the staff provided a hook to pull a sheep in the right direction, or out of a crevice or hole. Unfortunately, it was also often used by officers to discipline citizens or criminals. The staff had many different functions, depending on the job or position you had.
                        <br><br>
                        <b>Works Cited:</b> https://ancientbiblehistory.com/blog/rod-and-staff
                    </label>
                </form>
            </div>
            
            <div class="wine">
                <form>
                    <img src="{% static 'wine.jpg' %}" class="img" alt="Wine Image">
                    <label class="label">
                        <b>Wine</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 2:13- "Some, however, made fun of them and said, "They have had too much wine."
                        <br><br>
                        <b>Facts:</b> Wine was a common drink in the Bible but wasn't as strong as modern wine is today. The wine was made from grape juice that was fermented, often in clay pots. During Acts 2 some people made fun of the apostles after they began to speak in other languages on the day of Pentecost (see the Tongues of Fire section). They joked that the apostles were drunk, which brings up another fact about wine from Bible times. Even though it was supposedly less alcoholic than wine today, people still often got drunk for drinking too much wine. However, wine makers sometimes used this to their advantage during parties or events. They served the good wine to guests until they were drunk before serving the bad wine. That way the drunk guests wouldn't taste the difference.
                        <br><br>
                        <b>Works Cited:</b> https://www.biblicalarchaeology.org/daily/ancient-cultures/ancient-rome/roman-wine-from-the-time-of-jesus/
                    </label>
                </form>
            </div>
            
            <div class="boats">
                <form>
                    <img src="{% static 'boats.jpeg' %}" class="img" alt="Boats Image">
                    <label class="label">
                        <b>Boats</b>
                        <br><br>
                        <b>Acts reference:</b> Acts 27:30-32- "In an attempt to escape from the ship, the sailors let the lifeboat down into the sea, pretending they were going to lower some anchors from the bow. Then Paul said to the centurion and the soldiers, "Unless these men stay with the ship, you cannot be saved." So the soldiers cut the ropes that held the lifeboat and let it drift away."
                        <br><br>
                        <b>Facts:</b> Different boats were used for different purposes. Lifeboats were used to escape a sinking ship while fishing boats were used for, well, fishing. Other boats had trading or transportation purposes. They were all commonly wood vessels with either oars or sails (and sometimes both).
                    </label>

                        <b>Acts reference:</b> Acts 7:24- "The God who made the world and everything in it is the Lord of heaven and earth and does not live in temples built by human hands.". Acts 5:20- "Go, stand in the temple courts," he said, "and tell the people all about this new life."
                        <br><br>
                        <b>Facts:</b> The temple is such an important building/place in the Bible that there is just so much to say about it. But I'll try to keep it short. The actual structure of the temple consisted of several rooms or courts, many of which were open to the public. People would gather in the temple courts to pray and offer sacrifices. But there was one room, called the holy of holies, that wasn't accessible to anyone except a select priest. This room had a 60 foot high ceiling and was often left dim. It was a sacred place where God would come down to the temple. The chosen prehistoric would go in once a year to burn incense for God. The temple courts, a place that was crowned, loud, and exposed to the sun, was probably the complete opposite of the holy of holies. During Acts chapter 5, the disciples are told to preach in the temple courts by an angel. At this point in the story, they had just been rescued from prison but are willing to put their lives at risk to preach the gospel.
                        <br><br>

                        <br><br>
                        <b>Facts:</b> Swords were used by many people during biblical times and were a simple, yet deadly weapon. Roman swords, aka Gladius Hispaniensis, were 24 inches in length and were an obvious sign of authority. Interestingly enough, any short sword was not classified as a weapon for war and could thus be used by Jewish people without being confiscated. Another sword of the era was the Machaira, a short, curved blade. But regardless of the type of sword, they were all associated with violence. In fact back in the Bible times, saying to put someone to the sword meant to kill them.
