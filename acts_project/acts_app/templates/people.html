            <div class="peter">
                <form>
                    <img src="{% static 'peter.jpg' %}" class="img" alt="Peter Image">
                    <label class="label">
                        <b>Peter</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        He was born with the name "Simon" in the Galileean village of Bethsaida. His brother, Andrew, was another one of Jesus' disciples. Peter was a witness to many of Jesus' most notable events such as the Transfiguration, the raising of Jarius's daughter, the Garden of Gethsamane, the feeding of the 5,000, along with dozens of other significant and impactful moments. Peter is often cited as a man who, despite being very imperfect, had much faith and ended up spreading Christianity to thousands of people. He denied Jesus 3 times during his arrest, turned to the waves when walking on water, and even cut off a servant's ear. However, Jesus still commissioned him to "feed my sheep," essentially making him the head of the early church (which is why Catholics point to him as the first Pope). After the ascension, he became witness to many of the early church's most significant events, including Pentecost, the first bringing of the gospel to gentiles, and the healing of many people. He was arrested 3 times, but managed to escape each time. Eventually, the authorities caught up with him and he was famously crucified upside down.
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>Pentecost (Acts 2)</li>
                            <li>Healing Aeneas (Acts 3:1-10)</li>
                            <li>Healing the Lame Man (Acts 3)</li>
                            <li>Facing the Sanhedrin/First Arrest (Acts 4)</li>
                            <li>Confronting Ananias and Sapphira (Acts 5)</li>
                            <li>Rebuking of Simon the Sorcerer (Acts 8:14-25)</li>
                            <li>Raising Tabitha (Acts 9:32-35)</li>
                            <li>Converting Cornelius (Acts 10)</li>
                            <li>Being Rescued From Herod Agrippa's Prison by an Angel (Acts 12)</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>He was the disciple who performed the most miracles (6).</li>
                            <li>He was the only other person in history to walk on water except for Jesus.</li>
                            <li>He was the first disciple to meet Jesus after the resurrection and the encounter in the locked room.</li>
                            <li>He was crucified upside down because he didn't feel worthy to be executed in the same way as Jesus.</li>
                        </ul>
                        <br><br><br><br><br><br><br>
                        <b>Peter in Acts:</b>
                        <br><br>
                        In the Acts of the Apostles, Saint Peter is one of the main leaders of the early Church after Jesus goes back up to heaven. At the beginning of the book, Peter leads the other believers in choosing someone to replace Judas. They choose Matthias to be one of the twelve apostles (Acts 1:15–26). This shows that Peter was already taking responsibility and helping guide the group.
                        <br><br>
                        In Acts chapter 2, Peter gives a powerful speech on the day of Pentecost when the Holy Spirit comes to the believers. He explains to the crowd what is happening and tells them about Jesus. Because of his message, about three thousand people are baptized that day (Acts 2:14–41). This was a huge moment for the Church, and it shows how bold Peter had become.
                        <br><br>
                        Peter also performs miracles through God's power. In Acts 3:1–10, he heals a man who could not walk at the temple gate called Beautiful. Later, in Acts 5:1–11, Peter confronts Ananias and Sapphira for lying about money they gave to the Church and they DIE. In Acts 5:15, people literally hoped that Peter's shadow might heal them as he walked by. These events show that God was working through Peter in amazing ways.
                        <br><br>
                        Peter faced persecution for preaching about Jesus. In Acts 4:1–22, he and John are arrested for teaching in the name of Jesus. Even after being warned to stop, Peter boldly says, "We must obey God rather than men" (Acts 5:29). This shows his courage and strong faith, even when he was threatened.
                        <br><br>
                        Later in Acts, Peter helps spread the gospel to Gentiles (non-Jews). In Acts 10, he has a vision from God and then visits a Roman centurion named Cornelius. When Peter preaches to him and his household, they receive the Holy Spirit (Acts 10:34–48). This was an important turning point because it showed that the message of Jesus was for everyone, not just the Jewish people. Overall, Peter plays a major role in leading, teaching, healing, and helping the early Church grow in the Book of Acts.
                    </label>
                </form>

            <div class="john">
                <form>
                    <img src="{% static 'john.jpg' %}" class="img" alt="John Image">
                    <label class="label">
                        <b>John</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        John the Apostle was one of Jesus' twelve disciples and was the son of Zebedee and the brother of James. Before following Jesus, he worked as a fisherman just like many other disciples. Jesus gave John and his brother the nickname "Sons of Thunder," probably because they had strong personalities (Mark 3:17) (which sounds really cool). John was part of Jesus' inner circle, along with Peter and James. He saw important events like the Transfiguration and when Jesus prayed in the Garden of Gethsemane. Many Christians believe John wrote the Gospel of John, 1–3 John, and Revelation. He lived a long life and continued teaching people about Jesus.
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>Stayed in Jerusalem after Jesus went back to heaven (Acts 1:13)</li>
                            <li>Pentecost (Acts 2:1–4)</li>
                            <li>Helped heal a man who could not walk at the temple gate called Beautiful (Acts 3:1–10)</li>
                            <li>Was there when Peter preached to the crowd after the healing (Acts 3:11–26)</li>
                            <li>Was arrested with Peter for preaching about Jesus (Acts 4:1–3)</li>
                            <li>Spoke boldly to the Sanhedrin (Acts 4:13–20)</li>
                            <li>Actually died a natural death instead of being executed (which is a very unnatural death for the apostles sadly).</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>He was one of only a few people who got to look into heaven. Among the others were Ezekial, Elijah, and Stephen.</li>
                            <li>He was also one of the only people to receive a vision about the endtimes. Among the others were Daniel and some other people whom I'm too lazy to research.</li>
                            <li>For some reason, instead of being killed, he was sent into exile.</li>
                            <li>He was one of Jesus' inner circle. He was one of the few people to witness the transfiguration, the Garden of Gethsemane, and his empty tomb.</li>
                            <li>He is in one of the best superbook episodes ever.</li>
                            <li>According to pictures of him, he had a really chopt hairline.</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br>
                        <b>John in Acts:</b>
                        <br><br>
                        In the book of Acts, John was one of the leaders in the early church. After Jesus went back to heaven, John stayed in Jerusalem with the other apostles. They waited for the Holy Spirit, just like Jesus told them to. In Acts 2, John was there when the Holy Spirit came at Pentecost. This was a big moment because it marked the start of the Christian church.
                        <br><br>
                        In Acts 3, John went with Peter to the temple to pray. They saw a man who had not been able to walk since birth. Through the power of Jesus, the man was healed. John stood next to Peter during this miracle. A big crowd gathered, and Peter preached about Jesus. Even though John did not do the talking, he was still part of the event and helped spread the message.
                        <br><br>
                        After this, John and Peter were arrested in Acts 4. The religious leaders did not like (like, really didn't like) that they were teaching about Jesus rising from the dead. When they were brought before the Sanhedrin, they did not act scared and refused to stop talking about Jesus. This shows he was brave and serious about his faith.
                        <br><br>
                        Later in Acts 8, John went with Peter to Samaria. Many people there believed in Jesus and John prayed for them so they could receive the Holy Spirit. This was important because it showed that the message of Jesus was spreading to more places. Overall, in Acts, John is shown as faithful, brave, and committed to helping grow the early church.
                    </label>
                </form>
            </div>
            
            <div class="james_greater">
                <form>
                    <img src="{% static 'james_john_bro.webp' %}" class="img" alt="James Brother of John Image">
                    <label class="label">
                        <b>James Brother of John (James the Greater)</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        James, the brother of John the Apostle, was one of the twelve apostles of Jesus Christ and part of Jesus's closest inner circle. He was a fisherman before following Jesus and quickly became known for his bold personality—Jesus even nicknamed James and John the "Sons of Thunder." James witnessed several major moments in Jesus's ministry, including the Transfiguration and Jesus raising Jairus's daughter. In the early church, he became an important leader and missionary. He is most remembered for being the first apostle to be executed for his faith when Herod Agrippa I had him killed (Acts 12:1–2). James was also present in the upper room after Jesus's ascension (Acts 1:13–14).
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>James is listed among the apostles gathered in Jerusalem after Jesus's ascension (Acts 1:13)</li>
                            <li>James joins the believers praying together in the upper room (Acts 1:14)</li>
                            <li>James is arrested during King Herod's persecution of church leaders (Acts 12:1)</li>
                            <li>James is executed by the sword, becoming the first apostle martyred (Acts 12:2)</li>
                        </ul>
                        <br><br><br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>He was called camel legs because of how intense his prayer habits were (which is a less cool name than sons of thunder).</li>
                            <li>He was John's older brother, explaining his nickname as James the elder.</li>
                            <li>He is often called James the Greater to avoid confusion with James the Less (who ironically was Jesus' brother).</li>
                            <li>He was likely among the oldest of the apostles.</li>
                        </ul>
                        <br><br><br><br><br><br><br>
                        <b>James in Acts:</b>
                        <br><br>
                        James appears early in Acts as one of the core disciples who stayed together after Jesus returned to heaven. He was in Jerusalem with the other apostles, praying and waiting for guidance (Acts 1:13–14). This shows he remained a committed leader from the very start of the early church.
                        <br><br>
                        Although Acts focuses more on Peter and later Paul, James is shown as part of the main group leading the church's growth. He would have shared responsibility for teaching, organizing believers, and spreading Jesus's message throughout Jerusalem during a time when Christianity was still very new and sometimes dangerous.
                        <br><br>
                        James also lived during a period of increasing persecution. Religious leaders and political rulers were worried about how fast the Christian movement was growing. As a well-known apostle, James would have been a visible target.
                        <br><br>
                        His life in Acts ends suddenly but powerfully. King Herod Agrippa I arrested several church leaders to stop the movement, and James was executed by the sword (Acts 12:1–2). This made him the first apostle to be martyred, showing how serious the risks were for early Christian leaders.
                        <br><br>
                        Even though his role in Acts is brief, his death had a big impact. It showed that the apostles were willing to die for their faith, which strengthened other believers. His martyrdom also marks a turning point where persecution became more intense and the church began spreading even farther beyond Jerusalem.
                    </label>
                </form>
            </div>
            
            <div class="james_less">
                <form>
                    <img src="{% static 'james_jesus_bro.jpeg' %}" class="img" alt="James the Less Image">
                    <label class="label">
                        <b>James the Less</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        James the Less, also called James son of Alphaeus, was one of the twelve apostles of Jesus Christ. He earned the nickname "the Less" most likely because he was younger, shorter (LOL), or simply less well-known than James the Greater. The Bible doesn't record many specific stories about him, but he was part of Jesus's close group of disciples and stayed committed throughout Jesus's ministry. After the resurrection, James continued as a faithful member of the early church. Some church traditions connect him with leadership roles and missionary work, but the Bible itself keeps his role brief and low-profile.
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>Was at Jesus's ascension (Acts 1:13)</li>
                            <li>Prayed in the upper room (Acts 1:14)</li>
                        </ul>
                        <br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>He's called "the Less" to avoid confusion with James the Greater.</li>
                            <li>His picture depicts him without a finger on his right hand.</li>
                            <li>He was one of the original twelve apostles chosen by Jesus.</li>
                            <li>Very little is recorded about his words, which shows not every important leader is famous.</li>
                            <li>Some traditions say he may have traveled to preach in different regions after Jesus's ascension.</li>
                        </ul>
                        <br><br><br><br><br><br><br><br>
                        <b>James the Less in Acts:</b>
                        <br><br>
                        James the Less appears briefly in Acts as part of the group of apostles who stayed in Jerusalem after Jesus returned to heaven. He is specifically named among the eleven disciples gathered together (Acts 1:13). This shows he remained faithful and continued working with the core leadership of the early church.
                        <br><br>
                        He was also present with the believers who met constantly for prayer (Acts 1:14). Even though Acts doesn't describe his individual actions, being part of this group mattered a lot. These were the people leading the early Christian movement, making decisions, teaching others, and supporting the church during a time when their faith could be dangerous. All in all, it took a lot of word fat to fill two paragraphs about him.
                    </label>
                </form>

            <div class="andrew">
                <form>
                    <img src="{% static 'andrew.jpg' %}" class="img" alt="Andrew Image">
                    <label class="label">
                        <b>Andrew</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        Andrew was one of the twelve apostles of Jesus Christ and the brother of Simon Peter. Before following Jesus, Andrew worked as a fisherman, but he became one of the first disciples called to join Jesus's ministry. He is known for bringing people to Jesus, including introducing his brother Peter. Andrew stayed loyal through Jesus's ministry, crucifixion, and resurrection, and he continued serving as a leader in the early church. After Jesus ascended to heaven, Andrew remained with the apostles in Jerusalem, praying and helping guide the growing group of believers (Acts 1:13–14).
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>Witnesses Jesus's ascension (Acts 1:13)</li>
                            <li>Meets together in constant prayer (Acts 1:14)</li>
                        </ul>
                        <br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>Andrew was one of the very first disciples Jesus called.</li>
                            <li>He was originally a follower of John the Baptist before meeting Jesus.</li>
                            <li>He is the brother of Peter, one of the most famous apostles.</li>
                            <li>Andrew is known for quietly bringing others to Jesus rather than seeking attention.</li>
                            <li>Tradition says he later became a missionary in areas around Greece and was martyred.</li>
                        </ul>
                        <br><br><br><br><br><br><br><br>
                        <b>Andrew in Acts:</b>
                        <br><br>
                        Andrew's role in Acts is brief but still important. After Jesus returned to heaven, Andrew stayed in Jerusalem with the other apostles instead of going back to his old life. This shows his commitment to the mission Jesus gave them. He is specifically listed among the eleven apostles who gathered together (Acts 1:13). Being named means he was recognized as part of the core leadership group responsible for guiding the early church during a confusing and uncertain time.
                        <br><br>
                        Andrew was also present when the believers met constantly for prayer and unity (Acts 1:14). These meetings helped strengthen the group and prepare them for spreading Christianity. Even though Acts does not record Andrew speaking or leading major events, he was still part of the foundation of the early church and shared in its risks and responsibilities.
                    </label>
                </form>
            </div>
            
            <div class="phillip_apostle">
                <form>
                    <img src="{% static 'philip.jpg' %}" class="img" alt="Philip the Apostle Image">
                    <label class="label">
                        <b>Philip the Apostle</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        Philip was one of the twelve apostles chosen by Jesus Christ. He was from Bethsaida, the same town as Peter and Andrew, and he was personally called by Jesus to follow Him (John 1:43). Philip is often shown in the Gospels as thoughtful and practical, sometimes asking questions to better understand what Jesus was teaching. He also brought his friend Nathanael (Bartholomew) to meet Jesus, showing that he cared about sharing his faith. After Jesus's resurrection and ascension, Philip remained committed to the group of apostles and continued helping lead the early church.
                        <br><br>
                        <b>Important Events:</b>
                        <ul class="bullets">
                            <li>Was at Jesus's ascension (Acts 1:13)</li>
                            <li>Philip joins the believers meeting together in constant prayer (Acts 1:14)</li>
                        </ul>
                        <br><br><br><br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>He was personally called by Jesus rather than coming through another disciple.</li>
                            <li>He brought Nathanael to Jesus.</li>
                            <li>He asked Jesus questions at the Last Supper (John 14:8–9).</li>
                            <li>He is sometimes confused with Philip the Evangelist, but they are two different people.</li>
                        </ul>
                        <br><br><br><br><br><br><br>
                        <b>Philip in Acts:</b>
                        <br><br>
                        Philip the Apostle appears briefly in Acts, but his presence still matters. He is specifically named among the eleven apostles who gathered together after the ascension (Acts 1:13). Being listed shows he was still part of the core leadership group of the early church. These apostles were responsible for teaching new believers and keeping the group united during a time when their faith could bring persecution.
                        <br><br>
                        Philip was also present when the believers met together constantly in prayer (Acts 1:14). Even though Acts does not record him giving speeches or leading major events, he helped form the foundation of the early church simply by staying faithful, united, and committed alongside the other apostles.
                    </label>
                </form>
            </div>
            
            <div class="paul">
                <form>
                    <img src="{% static 'paul.jpg' %}" class="img" alt="Paul Image">
                    <label class="label">
                        <b>Paul</b>
                        <br><br>
                        <b>Brief Biography:</b>
                        <br><br>
                        Paul, originally known as Saul, was one of the most influential leaders in early Christianity. He was born a Jewish Roman citizen and was highly educated in Jewish law, studying under respected teachers. At first, Saul strongly (like, realllllly strongly) opposed Christians and even helped persecute them. However, after a dramatic encounter with Jesus, his life completely changed. He became a devoted Christian missionary, traveling long distances to teach people about Jesus and help start new churches. Paul's writings and journeys shaped the growth of Christianity across the Roman world.
                        <br><br>
                        <b>Important Events:</b>

                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>The word Gentile is an English translation of the Hebrew word goyim, which means people or nations.</li>
                            <li>Samaritans were half Gentile and half Jewish, but regardless the Jews still viewed them as enemies.</li>
                        </ul>
                        <br><br><br><br><br>
                        <b>Gentiles in Acts:</b>
                        <br><br>
                        Jews were forbidden to teach Gentiles the gospels, which is why it caused a lot of controversy when Peter baptized Cornelius in Acts 10. But during events such as the Holy Spirit coming at Pentecost (Acts 2), and Peter's vision of animals (Acts 10), God showed the apostles how his kingdom is for everyone. As Peter said in Acts 10:34-35 "I now realize how true it is that God does not show favoritism, but accepts from every nation the one who fears him and does what is right.". In fact, a large majority of Acts is about the disciples, Paul, and other Christians establishing Gentile churches and bringing many Gentiles to faith.
                    </label>
                </form>
            </div>
            
            <div class="pharisees">
                <form>
                    <img src="{% static 'pharisees.webp' %}" class="img" alt="Pharisees Image">
                    <label class="label">
                        <b>Pharisees</b>
                        <br><br>
                        <b>Brief History:</b>
                        <br><br>
                        The Pharisees were a group of religious leaders who taught the law of Moses and the Old Testament to the Jews. Unfortunately, while they taught the law of God, they didn't actually do what God wanted them to do. And that led them to be repeatedly criticized by Jesus. Eventually the Pharisees conspired with the Sadducees to kill Jesus. They were successful (because God let them). But after Jesus rose from the dead. And his disciples went to spread the gospel to the world. The Pharisees made it their mission to stop Christianity. But if there was one thing they would learn in the process, it's that you can't stop God's plan.
                        <br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>The Pharisees had EXTREMELY big egos and would often pray aloud in the temple or streets about how God has blessed them. They wanted people to see how holy and righteous they were.</li>
                            <li>They were very knowledgeable about the Torah.</li>
                            <li>The Pharisees and Sadducees were rivals, but put their differences aside when they conspired to kill Jesus.</li>
                            <li>They made up a lot of dumb rules for the Sabbath. On that day of the week you couldn't: Heal someone, Transport items from one place to another, Only walk a certain number of steps (LOL), etc.</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br>
                        <b>Pharisees in Acts:</b>
                        <br><br>
                        The Pharisees are mentioned a ton in Acts. They repeatedly arrest the apostles for teaching the gospel and most are implied to be members of the Sanhedrin. The apostle Paul himself used to be a pharisee before changing his name and being converted. In fact, Paul was the main leader in the Pharisees goal to eliminate Christianity. If he hadn't been converted by Jesus, he could've become high priest. But nevertheless, God had a plan for Saul and he would soon become an incredible missionary and one of the main characters in Acts. Another Pharisee named Gamaliel played an important role in the Sanhedrin's decision to see if the apostles truly were carrying out the will of God. Because if they were, the Pharisees could not stop them. "You will only find yourselves fighting God." Gamaliel told them. (They seem more power-hungry than followers of God.)
                    </label>
                </form>
            </div>
            
            <div class="sadducees">
                <form>
                    <img src="{% static 'sanhedrin.webp' %}" class="img" alt="Sadducees Image">
                    <label class="label">
                        <b>Sadducees</b>
                        <br><br>
                        <b>Brief History:</b>
                        <br><br>
                        The Sadducees were people who didn't believe in the resurrection. They also didn't believe in spirits, angels, or demons. They are first mentioned in the New Testament as people who despised Jesus and his teachings. Very similar to the Pharisees, they confronted Jesus occasionally, hoping to get him in trouble. They also conspired to kill Jesus together. The Sadducees were later disbanded in AD 70, after the city of Jerusalem was destroyed by the Romans, along with the temple.
                        <br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>They were very influential and often held wealthy or powerful positions in the Jewish society.</li>
                            <li>Some bible scholars and historians argue that the grand Sanhedrin (see the section on the Sanhedrin), was made up of Sadducees.</li>
                            <li>They were more like a political party than a group of officials.</li>
                        </ul>
                        <br><br><br><br><br><br>
                        <b>Sadducees in Acts:</b>
                        <br><br>
                        The Sadducees are mentioned several times throughout Acts. In Acts 4:1, they, along with the priests and temple guard confront Peter and John for teaching the gospel. Another mention of them can be found in Acts 5:17, where they are filled with jealousy after the apostles start to heal people across Jerusalem. Finally, the Sadducees are explained in Acts 23:8 to not believe in the resurrection or angels and spirits.
                    </label>
                </form>
            </div>
            
            <div class="sanhedrin">
                <form>
                    <img src="{% static 'disciples.webp' %}" class="img" alt="Sanhedrin Image">
                    <label class="label">
                        <b>Sanhedrin</b>
                        <br><br>
                        <b>Brief History:</b>
                        <br><br>
                        The Sanhedrin was a group of Jewish officials who served as a court. They were sort of like a Jewish council or court. After being formed under Roman rule, the Sanhedrin would go on to deal with political, religious, and judicial cases. Unfortunately, the Sanhedrin in Jerusalem was disbanded after a failed rebellion against Rome in 66-70 AD. However, a new Sanhedrin was formed in Jabneh and continued on its job.
                        <br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>Bible scholars have long argued about the composition of the Sanhedrin. Some believe that it was made of Sadducees, while others believe it consisted of the Pharisees, still others argue that it could have been a mix of the two groups.</li>
                            <li>Most areas had a smaller local Sanhedrin while Jerusalem had a large grand Sanhedrin, which was similar to the present day Supreme Court in their society.</li>
                        </ul>
                        <br><br><br><br><br>
                        <b>Sanhedrin in Acts:</b>
                        <br><br>
                        The Sanhedrin are most notably mentioned in Acts 4:1-22 where they put Peter and John on trial, only to be condemned themselves by Peter for rejecting Jesus and his teachings. The Sanhedrin appeared again in Acts 5:17-42 where they arrested the disciples for preaching in the temple courts. But at night, God sent an angel to free the apostles and in the morning the Sanhedrin found the same they had imprisoned preaching in the temple courts. They brought in the disciples and had them flogged before letting them go. The following people are actually named members of the Sanhedrin in the book of acts.
                        <ul class="bullets">
                            <li>Annas (the high priest)</li>
                            <li>Caiaphas</li>
                            <li>John</li>
                            <li>Alexander</li>
                            <li>Gamaliel</li>
                        </ul>
                        <br><br><br><br><br><br><br><br>
                    </label>
                </form>
            </div>
            
            <div class="roman_soldiers">
                <form>
                    <img src="{% static 'roman_soldiers.jpeg' %}" class="img" alt="Roman Soldiers Image">
                    <label class="label">
                        <b>Roman Soldiers</b>
                        <br><br>
                        <b>Brief History:</b>
                        <br><br>
                        Ever since the Roman Empire became a global power in the time of Jesus, a strong military was needed to maintain order and protect such a massive kingdom. And arguably, Roman soldiers were among the most feared military forces of their time.
                        <br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>Their armor was made of iron, bronze, and sometimes with chainmail.</li>
                            <li>Weapons for the soldiers included the Gladius, a short sword designed for close combat, the Pilum, a long javelin used for throwing at enemies, and the Scutum, a large rectangular body shield.</li>
                            <li>The most famous Roman battle tactic was the tesudo, or tortoise formation. It involved soldiers marching close together and using their large body shields to create a massive wall in front of, and over them. It was designed to repel even the toughest projectiles.</li>
                            <li>Their military organization was one of the most sophisticated in the world.</li>
                            <li>They each carried staffs with eagles on them. Losing an eagle would be a tremendous humiliation in their culture.</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br><br>
                        <b>Roman Soldiers in Acts:</b>
                        <br><br>
                        Roman soldiers are most notably mentioned in later chapters of acts. A centurion was mentioned during Paul's arrest and another one during Paul's prison transfer. After realizing how Paul had saved everyone on the ship from certain death, he made sure that the prisoners, including Paul, were spared when they crashed on the island of Malta. Roman soldiers later guarded Paul as he preached in the city of Rome.
                    </label>
                </form>
            </div>
            
            <div class="early_christians">
                <form>
                    <img src="{% static 'persecution.webp' %}" class="img" alt="Early Christians Image">
                    <label class="label">
                        <b>Disciples/Early Christians</b>
                        <br><br>
                        <b>Brief History:</b>
                        <br><br>
                        The church was founded by Peter and the rest of the apostles. Many people in Jerusalem were successfully converted and thus became members of the early church. Unfortunately, the growth of the church would soon be interrupted. Because the religious leaders didn't like the idea of Jesus's teaching spreading across the city (They didn't even like Jesus to begin with). So Saul, one of the head Pharisees, began to try and arrest the church's members. He threw both men and women in jail for following Christ. The early Christians soon found themselves persecuted and scattered. But nothing could stop God's plan, and his word would eventually reach places across the land.
                        <br><br>
                        <b>Fun Facts:</b>
                        <ul class="bullets">
                            <li>The early Christians would often sell their houses, possessions, and even land just to give it to the apostles so it would be distributed among the needy.</li>
                            <li>Another tradition of the early church was to break bread, just as Jesus had done at the last supper.</li>
                            <li>(Not) fun fact: The early Christians would unfortunately be persecuted for a long time, but during those years, they would also grow tremendously. Churches would be established in several places around the globe.</li>
                        </ul>
                        <br><br><br><br><br><br>
                        <b>Early Christians in Acts:</b>
                        <br><br>
                        The book of acts is pretty much focused on the conversion of many people to Christianity. It talks about missionary trips, life-changing experiences, and the holy spirit working through people to spread the gospel. The following people are just a few of the many converted in acts:
                        <ul class="bullets">
                            <li>Saul/Paul (Acts 9:1-19)</li>
                            <li>Lydia (Acts 16:11-15)</li>
                            <li>Simon the sorcerer (Acts 8:9-13)</li>
                            <li>Ethiopian Eunuch (Acts 8:26-40)</li>
                            <li>Jailer in Philippi (Acts 16:27-34)</li>
                        </ul>
                        <br><br><br><br><br><br><br><br>
                        There were also many early Christians who we didn't see the conversion of, but were also equally important in acts. The ones listed below are a few of them:
                        <ul class="bullets">
                            <li>Stephen</li>
                            <li>Tabitha</li>
                            <li>Ananias (Not the one from Acts 5)</li>
                            <li>Barnabas</li>
                            <li>Silas</li>
                            <li>Cornelius</li>
                            <li>Mary the mother of John Mark</li>
                        </ul>
                        <br><br><br><br><br><br><br><br><br><br>
                    </label>
                </form>
