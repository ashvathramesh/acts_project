        <div class="body">
            <div class="ascension">
                <form>
                    <img src="{% static 'ascension.jpeg' %}" class="img" alt="Ascension Image">
                    <label class="label">
                        <b>Ascension (Acts 1:1-11)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        It was forty days after Jesus had risen from the dead. He told his disciples to head to Jerusalem and wait for a gift from God. He said that just as followers of Christ are baptized in water, they would be baptized in the Holy Spirit. Then, right before their eyes, Jesus was taken up to heaven. The disciples were astonished and stayed staring at the sky for a while. And eventually two angels came down and asked them "Men of Galilee, why do you stand here looking into the sky? This same Jesus, who has been taken from you into heaven, will come back in the same way you have seen him go into heaven."
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        For starters, this is when Jesus goes up to heaven again. But the angels that come down and talk to the disciples also foreshadow that he will return to earth one day. And what Jesus said about being baptized in the Holy Spirit will come true (see tongues of fire section).
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        Jesus will return to Earth one day and we have to be ready for that. This event also symbolizes how God always keeps his word. The promise that Jesus gives the disciples comes true in the next chapter of Acts.
                    </label>
                </form>
            </div>
            
            <div class="ananias_sapphira">
                <form>
                    <img src="{% static 'sapphira.jpg' %}" class="img" alt="Ananias and Sapphira Image">
                    <label class="label">
                        <b>Ananias and Sapphira die (Acts 5:1-11)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        During Acts chapter 5, a man named Ananias and his wife Sapphira sold a piece of property to the church, but kept some of the money for himself. Peter confronted Ananias and told him by keeping money for himself he had lied against the church and holy spirit. At that moment Ananias fell down and died. Shortly afterwards, his wife Sapphira was also confronted by Peter. She had known her husband had secretly kept money for them instead of the church. And she too, fell down and died.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        God was setting an important standard for the early church. They need to truly fear God and be courageous instead of pretending to do either.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        First off, you can't lie to God. He knows what you did, are doing, and will do. But another lesson from this passage is that you need to give yourself a healthy fear of the Lord. You'll make decisions based on what you fear the most.
                    </label>
                </form>
            </div>
            
            <div class="philip_samaria">
                <form>
                    <img src="{% static 'philip_samaria.jpeg' %}" class="img" alt="Philip in Samaria Image">
                    <label class="label">
                        <b>Philip in Samaria (Acts 8:4-8)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Philip went to Samaria in order to preach the gospel there. He healed the sick and lame. Philip also cast evil spirits out from people. Because of these signs, many people came to believe.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was one of the many missionary trips the disciples took in order to spread the news of the resurrection.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        The disciples began to spread the news to all people. Even the Samaritans, the Jews sworn enemies. They knew that God's offer was for all people, not just Jews (see the section on Peter's vision of animals). Now we can remember the same when thinking of other people different from us.
                    </label>
                </form>
            </div>
            
            <div class="selection_matthias">
                <form>
                    <img src="{% static 'matthias.jpg' %}" class="img" alt="Selection of Matthias Image">
                    <label class="label">
                        <b>The Selection of Matthias (Acts 1:12-26)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        The disciples decided to recruit someone to replace Judah. Who they later learned died. The candidates were Barsabbas and Matthias. Knowing God would know who to choose. They cast lots and decided on Matthias.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        A new disciple was added to the group in order to help spread the good news of Jesus.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        There's not a ton of applications for this event, but I can think of one. The disciples knew that God knows a person's heart. So they trusted God to choose the replacement for Judah. When we need wisdom, we can pray to God as well.
                    </label>
                </form>
            </div>
            
            <div class="apostles_freed">
                <form>
                    <img src="{% static 'apostles_freed.jpg' %}" class="img" alt="Apostles Freed from Prison Image">
                    <label class="label">
                        <b>Apostles Freed from Prison (Acts 5:17-26)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Peter and the other apostles thrown in jail by the Pharisees and religious leaders. But during the night an angel sent by God freed the apostles and opened the prison doors (for more information go to the section on prison doors). And later in the day the Pharisees found the people they had thrown in prison, preaching the gospel in the temple courts.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        God was once again demonstrating how you can't stop his ministry. And as you go through the book of acts you'll find this isn't the first time he rescues people from prison.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        God always finds a way to help. All we need to do is trust him and pray. He's always there, always listening to prayer. (For a better example of this application, head to the section on Peter's escape from prison).
                    </label>
                </form>
            </div>
            
            <div class="ethiopian_eunuch">
                <form>
                    <img src="{% static 'ethiopia_eunuch.jpeg' %}" class="img" alt="Ethiopian Eunuch Baptized Image">
                    <label class="label">
                        <b>Ethiopian Eunuch Baptized (Acts 8:26-39)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Philip felt an angel telling him to head south to Ethiopia. Philip obeyed and met an Ethiopian Eunuch. He was baptized by Philip, and converted to a Christian.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        The disciples are once again spreading news for the resurrection to the rest of the world. And the Eunuch in the story may have been the first Ethiopian to be officially baptized.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        Like I'm gonna say for lots of events with gentiles, we need to remember that everyone is welcome in God's kingdom. But this story also teaches us to trust in God's plan, Philip had no idea what God was sending him to Samaria for, but he still obeyed and went. That took some serious faith.
                    </label>
                </form>
            </div>
            
            <div class="pentecost">
                <form>
                    <img src="{% static 'pentecost.jpeg' %}" class="img" alt="Pentecost Image">
                    <label class="label">
                        <b>Pentecost (Acts 2:1-41)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        The disciples were all in one room on the day of Pentecost. Then, suddenly, what looked like touches of fire came down and rested over the disciple's heads. They then suddenly began talking in foreign languages. Then they went out of the room and started approaching the crowd, and each person heard the disciples speaking in their own language. Most were amazed, but some made fun of them and said "They've had too much wine!". Peter then stepped up and addressed the crowd with a speech. And he inspired many people to believe.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was the promise Jesus had told his disciples. On the day of Pentecost, he would send a gift from God to help the disciples preach the Gospel. This was also another sign on how God was preparing to spread the message of Jesus to the Gentiles.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        God keeps his promises and he will always show up when we need him. It might not be in the way we expect, or at the time we expect, but he always hears our prayers.
                    </label>
                </form>
            </div>
            
            <div class="choosing_seven">
                <form>
                    <img src="{% static 'choosing_seven.jpeg' %}" class="img" alt="Choosing of the Seven Image">
                    <label class="label">
                        <b>Choosing of the Seven (Acts 6:1-7)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Hellenistic Jews were complaining about how their houses were being overlooked during the daily distribution of food by the church. So the disciples decided to appoint seven righteous men to oversee the job of distributing food. Stephen, Philip, Procorus, Nicanor, Timon, Parmenas, and Nicolas were all chosen and converted to Judaism.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        The church was growing in number and the disciples had to do more work to keep the church running smoothly.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        The disciples knew not to leave the Hellenistic Jews out of the church's practices. God's kingdom has a place for everyone who believes.
                    </label>
                </form>
            </div>
            
            <div class="saul_conversion">
                <form>
                    <img src="{% static 'saul_convert.jpeg' %}" class="img" alt="Saul's Conversion Image">
                    <label class="label">
                        <b>Saul's Conversion (Acts 9:1-31)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Saul, who was probably one the most guilty people for persecuting christians, was on the road to Damascus. He was going there to, you guessed it, persecute christians. But on the way there, Jesus Christ himself suddenly appeared to Saul. There was also a flash of light from heaven that blinded Saul. Jesus asked him "Saul, why are you persecuting me?". After that, Saul remained blind for three days straight until God sent a disciple named Ananias to help Saul regain sight again. Then, Saul, filled with the holy spirit, began preaching to the people in Damascus and amazed everyone. (For more context on Saul getting his sight back, go to the section labeled Saul regains sight)
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        Saul was a major leader in the persecution of Christians, so now that he himself was a Christian, it was a major blow to the Pharisees's plan to eliminate the ministry of Jesus. Saul would go on to travel across the world, preaching the gospel to gentiles and establishing at least 14 different churches. This was the start of his great missionary work to spread the news of God.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        I feel like the main application for this one is more about Ananias than Saul. Ananias was probably scared to go see Saul, let alone help him. But he trusted God's plan and went to help someone who could potentially have him killed or imprisoned.
                    </label>
                </form>
            </div>
            
            <div class="peter_sermon">
                <form>
                    <img src="{% static 'peter_sermon.jpg' %}" class="img" alt="Peter's Sermon Image">
                    <label class="label">
                        <b>Peter's Sermon (Acts 2:14-41)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        It was just after Pentecost and the arrival of the holy spirit that Peter's Sermon happened. He and the other disciples rushed to the room they were staying in and began to preach in foreign tongues (A.K.A other languages). Most of the people were amazed. They said "These men are Galileans, yet we all hear them speaking in our native language.". This is when Peter began his sermon.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was the first of the disciple's many sermons. And it also symbolized how God was preparing to send his message to the gentiles. Because during Genesis 11 (the story of the Tower of Babel), God gave everyone different languages so they couldn't be unified. But here God is preparing to unify the people for when Jesus comes again.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        (The following are things that Peter preached in his sermon.)
                        <br><br>
                        Jesus died for us and our sins.
                        <br><br>
                        When we repent and are baptized, we receive the gift of the Holy Spirit.
                        <br><br>
                        We receive forgiveness for our sins when we devote our life to Jesus.
                        <br><br>
                        The promise of the Holy Spirit is for everyone, now and in the future.
                    </label>
                </form>
            </div>
            
            <div class="stephen_sermon">
                <form>
                    <img src="{% static 'stephen_sermon.jpg' %}" class="img" alt="Stephen's Sermon Image">
                    <label class="label">
                        <b>Stephen's Sermon (Acts 7:1-53)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Stephen was brought before the religious leaders and accused of crimes against God. This happened because people who wanted to get Stephen in trouble, lied to the religious leaders about him. In response Stephen stood up in the court and delivered the longest speech in the book of Acts. It covered everything in the time period between Abraham and Solomon. It also accused the religious leaders of resisting the holy spirit. Stephen said that they had received the law, but not obeyed it.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        What Stephen was saying was true, and still is today. It accused the religious leaders of not following the word of God and instead resisting it.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        We need to obey God's word and not resist it like the religious leaders. During his sermon, Stephen said that the Pharisees were no different from their ancestors. And if you read the bible you'll see its true. Those who refuse to accept God's word were eventually humbled by God.
                    </label>
                </form>
            </div>
            
            <div class="saul_sight">
                <form>
                    <img src="{% static 'saul_sight.jpeg' %}" class="img" alt="Saul Regains Sight Image">
                    <label class="label">
                        <b>Saul Regains Sight (Acts 9:7-19)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Ananias went to the house where Saul was staying, and he then placed his hand on Saul saying that God had sent him to give Saul his sight back. Then something like scales fell from Saul's eyes. And when Saul opened his eyes he could see again.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was an important part of Saul's conversion which was an important event in its own right (See the section on Saul's conversion).
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        Ananias used God's spiritual gift of healing to heal Paul. God gave us all spiritual gifts and it's our duty to use them to bring glory to him. It also took Ananias a lot of courage to go see Saul and help him. But he trusted God and his plan.
                    </label>
                </form>
            </div>
            
            <div class="healing_lame">
                <form>
                    <img src="{% static 'healing_lame.jpeg' %}" class="img" alt="Healing of the Lame Man Image">
                    <label class="label">
                        <b>Healing of the Lame Man (Acts 3:1-10)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Peter and John were at the temple during the time of prayer. They saw a man who was lame from birth staying on the temple gate. He did this all the time to ask for money. Peter told him "We don't have silver or gold, but we do have something else to offer. In the name of Jesus Christ of Nazareth, get up and walk!". They helped the man up and he soon realized he could walk. He walked and jumped around the temple courts, praising God. When other people saw this they were shocked and Peter went to address the onlookers.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This event caused many people to believe in Jesus and also marked one of the first miracles after the Ascension of Jesus. It was also the second sermon of Peter (Pentecost was the first.), because Peter did preach to the audience after he healed the man.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        This was another example of using your spiritual gifts to bring glory to God. And it also shows how God uses miracles to change people's lives. This man was crippled from birth, but once he met Peter and John, his life changed forever. (This is almost the same as the What it means to us section for the healing of Aeneas. That's because they both have extremely similar takeaways. In my opinion.)
                    </label>
                </form>
            </div>
            
            <div class="stoning_stephen">
                <form>
                    <img src="{% static 'stephen_stoned.jpg' %}" class="img" alt="The Stoning of Stephen Image">
                    <label class="label">
                        <b>The Stoning of Stephen (Acts 7:54-60)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        After Stephen gave his sermon (See the section on Stephen's sermon), the religious leaders were filled with rage. They dragged him out of the city and began to stone him. A young man named Saul saw this and offered to hold the coats of the people stoning Stephen. He thought they could throw stones better if they weren't being held down by a heavy coat. Meanwhile, Stephen said to the Lord, "God, forgive them.". As he said this, he fell asleep (he died).
                        <br><br>
                        <b>Why it was important / What it means to us:</b>
                        <br><br>
                        While the story may seem tragic, it sets an example for Christians back then and even in the present (just in a different way). Stephen spent his last moments praying for his enemies, which is just what Jesus did on the cross. It might be hard to love our enemies, but we need to remember that God loves them just as much as us.
                    </label>
                </form>
            </div>
            
            <div class="peter_aeneas">
                <form>
                    <img src="{% static 'peter_aeneas.jpg' %}" class="img" alt="Peter Heals Aeneas Image">
                    <label class="label">
                        <b>Peter Heals Aeneas (Acts 9:32-35)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Peter was in the city of Lydda, when he saw a man named Aeneas. Aeneas had been paralyzed for eight years, but Peter was about to change that. "Aeneas," Peter said to him, "Jesus Christ heals you. Get up and roll up your mat." Immediately, Aeneas got up and could stand. All those who saw it were amazed and believed in God from that moment on.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was another miracle that brought many people to Christ. And it was yet another miraculous healing that God performed.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        This was another example of using your spiritual gifts to bring glory to God. And it also shows how God uses miracles to change people's lives. Aeneas had been paralyzed for eight years, but once he met Peter, his life changed forever. (This is almost the same as the What it means to us section for the healing of the lame man. That's because they both have extremely similar takeaways. In my opinion.)
                    </label>
                </form>
            </div>
            
            <div class="arrest_peter_john">
                <form>
                    <img src="{% static 'peter_john_arrest.jpg' %}" class="img" alt="The Arrest of Peter and John Image">
                    <label class="label">
                        <b>The Arrest of Peter and John (Acts 4:1-4)</b>
                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Peter and John had just healed a crippled man (see the section of the healing of the lame man), at the temple. They began to speak to the audience on how Jesus rose from the dead. This angered the Pharisees (They pretty much got angry whenever people spoke about Jesus's teachings.), so Peter and John were arrested and put in jail until the next day.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        This was the first sign of threats that would try to stop Christianity from spreading. The religious leaders, Roman Empire, and even other Jews would all be major obstacles for the church during the book of acts.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        For me, the application on this one is not during the arrest, but after it. Peter and John were brought before the Sanhedrin and questioned. But Peter, filled with the Holy Spirit, responded courageously and asked the religious leaders why they were being called to account for an act of kindness to a man. We can apply this to our lives and not be afraid to speak out against the crowd when we know what God wants us to do.
                    </label>
                </form>
            </div>

                        <b>What it means to us:</b>
                        <br><br>
                        Everyone is welcome in God's kingdom. There might have been a time where God's word was only for the Jews. But now it's for everyone, including those that we think don't deserve it.

                </form>

                        <br><br>
                        God works through people even when we don't see it at first. He worked through Paul to keep the people on the boat safe, and also the centurion to keep Paul safe. I also think it was about trusting God. The people on the ship didn't trust Paul at first. It took their lives being put to risk for them to finally listen to him.

                        <br><br>

                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Paul spent time at the church of Syrian Antioch. He later begins to head northwest to visit churches he established during his first missionary journey. These were the churches in Derbe, Lystra, Iconium, and Pisidian Antioch. Paul arrives in the city of Ephesus, where he teaches the full gospel to people. While he converted a ton of people to Christ in Ephesus, some rejected his teachings. After spending three months in Ephesus, Paul and the Christians of the city moved to a school owned by a man named Tyrannus. There Paul preached to Jews and Greeks for two years. Unfortunately for him, a riot started against Paul before he was going to leave the city. However, Paul successfully left the city and journeyed to Philippi, Thessalonica, and Berea to encourage the churches that had been set up there. Afterward, he stayed in the Greek city of Achaia for three months. Paul later stayed in Troas and did many miracles such as raising a person named Eutychus from the dead. After leaving the city Paul and his men traveled to Mitylene, Trogyllium, and Miletus. Paul eventually went to Tyre in Syria. The disciples there begged him not to go to Jerusalem. They were concerned for Paul's safety. But Paul desperately wanted to finish his missionary trip and traveled there. Finally, Paul and his men arrived in Jerusalem where a man named Mnason let them stay at his house.
                        <br><br>
                        <b>Why it was important:</b>
                        <br><br>
                        Paul visited and encouraged many of the churches that he or other disciples set up. There were also several new churches that were established. Places such as Greece heard about the Gospel for the first time. Tons of people were converted to Christianity.
                        <br><br>
                        <b>What it means to us:</b>
                        <br><br>
                        Sometimes we need to put aside our fears to follow God's calling. Paul did this when he decided to go to Jerusalem despite how dangerous it was. We can also give people encouragement and advice, just like Paul did with many of the churches he set up.

                </form>

                        <br><br>
                        <b>What Happened:</b>
                        <br><br>
                        Paul, Barnabus, and John Mark begin the journey. The trio sails to Salamis on the island of Cyprus. There they converted many, including the island's Roman proconsul, Sergius Paulus. For reasons the Bible doesn't mention, John Mark leaves Paul and Barnabus to head back to Jerusalem. The duo heads up north to Pisidian Antioch to preach on the Sabbath. During his sermon, Paul gave a synopsis of the Israelites' exile in Egypt, the judges, Kings Saul and David, and John the Baptist. He also taught the people of Antioch how Jesus rose from the dead and fulfilled all of the prophecies about the messiah. Because many people believed in Christ that day, Paul and Barnabus returned on the next Sabbath to preach again. The gospel spreads through the whole region and yet many missionaries are persecuted. Paul and Barnabus leave for the city of Iconium where they preach boldly and perform many miracles. Rumors of plots to kill them send the duo to Lystra. In the city of Lystra, Paul notices a lame man listening to their sermon. He heals him and the amazed crowd concludes that they must be the gods Zeus and Hermes. But Paul and Barnabus deny this and tell the crowd about the one true God. Unfortunately, unbelieving Jews arrived and stirred the crowd against the Gospel. They began to stone Paul and dragged him out of the city. They thought he was dead, but later when the disciples surrounded his body, Paul stood up, totally fine, and walked back to the city. After what happened in Lystra Paul and Barnabus leave for Derbe. There they convert many to God. Afterward they traveled back to Lystra, Iconium, and Pisidian Antioch to strengthen the young churches they had established there. They also appointed elders to those churches. Next, the duo went to the city of Perga and preached there. After which they went to Attalia and did the same. Finally, they returned to Syrian Antioch and reported to the church how God had opened a door of faith to the Gentiles through them and talked about everything that had happened.

                        Many new churches were established by Paul and Barnabus. Several churches that were made were also revisited and strengthened. Thousands of Christians believed in Christ because of this.

                        <br><br>
                        When Paul and Barnabus rejected the praise as gods in Lystra, they were not only acknowledging that God was Lord. But also being humble, something that we should always do. Pride destroys all things, but true humility is what God looks for in a person's heart. Paul and Barnabus helped strengthen churches that they had set up in various cities. Cities that had many unbelievers and obstacles for the church. Similarly, we can strengthen people with kind words or sometimes just with our presence when they're going through a hard time.
                    </label>
                </form>
            </div>

                        <b>What Happened:</b>
                        <br><br>
                        Paul and Barnabus plan a second missionary journey. Their goal was to return to the cities and churches of Asia Minor that they had previously gone to on their first missionary journey. Barnabus wanted to take his cousin, John Mark, with them. But Paul refused to, as John had abandoned them on their first missionary trip. So Barnabus took John and sailed to Cyprus, while Paul took Silas, one of the leaders of the Jerusalem church, and went on his own missionary journey. Paul goes overland to the area of Derbe and Lystra and meets Timothy, who joins him and Silas on the journey. The trio sails to Troas and later to the island of Samothrace. Paul and Silas journey to the city of Philippi, where a woman named Lydia is converted, along with several other people. Paul heals a spirit possessed girl. And he and Silas are thrown in jail for it. But at midnight, God gives them a miraculous escape. (See the section on Paul put in prison in Philippi). The trio heads to Amphipolis and Apollonia to preach in the synagogue. But angry mobs formed against them, so they quickly escaped to Berea. The Jews in Berea accepted Paul's message much better than those in Amphipolis and Apollonia. Paul converted thousands and set sail for Athens while Silas and Timothy stayed behind. Paul accuses the people of Athens for worshipping idols, and while some accept his message, others attempt to prove it wrong. Paul meets Aquila and Priscilla at Corinth. Timothy and Silas also meet back with him in the same place. The group stayed in the city for a year and a half, preaching the gospel and reasoning with those who refused it. They later journeyed to Ephesus and stayed for a little while before returning to Antioch.

                        <br><br>

                    </label>
                </form>
